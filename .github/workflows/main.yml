name: Build TEK IT VST3 (Windows x64)
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -A x64
      - name: Build Release VST3
        run: cmake --build build --config Release --target TEK_IT_VST3
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEK-IT-VST3-Windows-x64
          path: build/TEK_IT_artefacts/Release/VST3/TEK IT.vst3
          if-no-files-found: warn
